<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="procwatch-token" content="__PROCWATCH_TOKEN__">
<title>Battery · Procwatch</title>
<style>
/* Battery: how worn it is, what it is doing now, and what stopped the Mac
   sleeping. Three panes, the same three the network monitor and the storage
   page use, so the windows obviously belong to one program.

   The sleep report used to be a card on the dashboard. It belongs here: what
   held a wake assertion at 3am is the same question as why the charge fell
   overnight, and answering half of it on one page and half on another is how
   neither gets read. */
:root{
  color-scheme:dark;
  --bg:#0a0a0c; --card:#131317; --line:#26262c; --raise:#1b1b21;
  --stripe:#17171c;
  --ink:#fafafa; --ink2:#a3a3ad; --ink3:#6d6d78;
  --s1:#3b82f6; --s2:#22c55e; --s3:#f59e0b; --s5:#ec4899; --s7:#ef4444;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --other:#52525b;
  --sel:rgba(59,130,246,.17); --hover:rgba(255,255,255,.04);
  --r:12px;
}
@media (prefers-color-scheme:light){
  :root:where(:not([data-theme=dark])){
    color-scheme:light;
    --bg:#f8f8f9; --card:#ffffff; --line:#e6e6ea; --raise:#f1f1f4;
    --stripe:#fafafb;
    --ink:#0f0f12; --ink2:#55555f; --ink3:#8b8b95;
    --s1:#2563eb; --s5:#db2777; --other:#a1a1aa;
    --sel:rgba(37,99,235,.13); --hover:rgba(0,0,0,.04);
  }
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#f8f8f9; --card:#ffffff; --line:#e6e6ea; --raise:#f1f1f4;
  --stripe:#fafafb;
  --ink:#0f0f12; --ink2:#55555f; --ink3:#8b8b95;
  --s1:#2563eb; --s5:#db2777; --other:#a1a1aa;
  --sel:rgba(37,99,235,.13); --hover:rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font:12.5px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text",
  system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;display:flex}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)}

#side{width:298px;flex:none;height:100%;display:flex;flex-direction:column;
  background:var(--card);border-right:1px solid var(--line)}
#sidehead{flex:none;padding:8px 10px 10px;border-bottom:1px solid var(--line)}
#back{display:inline-flex;align-items:center;gap:4px;font-size:11px;
  color:var(--ink3);text-decoration:none}
#back:hover{color:var(--ink)}
#sidebody{flex:1;overflow-y:auto;padding:13px 13px 20px}

/* The one number people came for, said as a number and as a bar. */
#healthbox{text-align:center;padding:6px 0 12px}
#healthpct{font-size:40px;font-weight:650;letter-spacing:-.03em;line-height:1}
#healthpct small{font-size:16px;font-weight:500;color:var(--ink3)}
#healthlabel{font-size:11px;color:var(--ink3);text-transform:uppercase;
  letter-spacing:.06em;margin-top:3px}
.bar{height:8px;border-radius:5px;background:var(--raise);overflow:hidden;
  margin:9px 0 4px}
.bar i{display:block;height:100%;border-radius:5px}

#main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;
  background:var(--bg)}
#head{flex:none;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
#head h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
#verdict{font-size:12.5px;color:var(--ink2);margin-top:3px;max-width:76ch;
  line-height:1.55}
#chartwrap{flex:none;padding:14px 16px 6px}
#chartwrap h2{font-size:11.5px;font-weight:600;color:var(--ink2);
  margin-bottom:6px}
#chart{width:100%;height:150px;display:block}
#sleeps{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 20px}
#sleeps h2{font-size:11.5px;font-weight:600;color:var(--ink2);margin:10px 0 5px}
.night{display:flex;align-items:baseline;gap:10px;padding:5px 0;
  border-bottom:1px solid var(--line);font-size:12px}
.night .when{width:118px;flex:none;color:var(--ink2)}
.night .what{flex:1;min-width:0}
.night .cost{flex:none;font-size:11.5px}
.drop{color:var(--warn)}
.fine{color:var(--ink3)}

#inspector{width:330px;flex:none;height:100%;display:flex;
  flex-direction:column;background:var(--card);border-left:1px solid var(--line)}
#inspbody{flex:1;overflow-y:auto;padding:15px 15px 24px}
.sect{border-top:1px solid var(--line);padding-top:9px;margin-top:9px}
.sect:first-child{border-top:0;margin-top:0;padding-top:0}
.sect>h2{font-size:11.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.kv{display:flex;gap:10px;padding:2.5px 0;font-size:11.5px}
.kv dt{width:118px;flex:none;color:var(--ink3)}
.kv dd{flex:1;min-width:0;word-break:break-word}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10.5px;
  font-weight:600}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);
  color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.hold{display:flex;gap:8px;padding:4px 0;font-size:11.5px;align-items:baseline}
.hold b{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.hold span{flex:none;color:var(--ink3)}
</style>
</head>
<body>

<div id="side">
  <div id="sidehead"><a id="back" href="/">&#8249; Dashboard</a></div>
  <div id="sidebody">
    <div id="healthbox">
      <div id="healthpct">&mdash;</div>
      <div id="healthlabel">of original capacity</div>
      <div class="bar"><i id="healthbar" style="width:0"></i></div>
    </div>
    <div id="sidefacts"></div>
  </div>
</div>

<div id="main">
  <div id="head">
    <h1>Battery</h1>
    <div id="verdict">Reading the battery&hellip;</div>
  </div>
  <div id="chartwrap">
    <h2>Charge, last 24 hours</h2>
    <canvas id="chart"></canvas>
  </div>
  <div id="sleeps"></div>
</div>

<aside id="inspector">
  <div id="inspbody"></div>
</aside>

<script>
"use strict";
var esc = function (t) {
  return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
};
var params = new URLSearchParams(location.search);
var KEY = params.get("key") || "";
var DEVICE = params.get("peer") || "";
var api = function (path, extra) {
  var query = [];
  Object.keys(extra || {}).forEach(function (k) {
    if (extra[k] !== undefined && extra[k] !== null && extra[k] !== "") {
      query.push(encodeURIComponent(k) + "=" + encodeURIComponent(extra[k]));
    }
  });
  if (KEY) { query.push("key=" + encodeURIComponent(KEY)); }
  if (!DEVICE) { return path + (query.length ? "?" + query.join("&") : ""); }
  return "/api/remote?peer=" + encodeURIComponent(DEVICE) +
    "&path=" + encodeURIComponent(path) +
    (query.length ? "&" + query.join("&") : "");
};
var css = function (name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name)
    .trim() || "#3b82f6";
};
var kv = function (key, value) {
  return '<dl class="kv"><dt>' + key + "</dt><dd>" + value + "</dd></dl>";
};
var hhmm = function (mins) {
  if (mins == null) { return "—"; }
  var h = Math.floor(mins / 60), m = mins % 60;
  return h ? h + " hr " + m + " min" : m + " min";
};
var dur = function (seconds) {
  if (!seconds) { return "—"; }
  var h = Math.floor(seconds / 3600), m = Math.round((seconds % 3600) / 60);
  return h ? h + " hr " + m + " min" : m + " min";
};

var BATT = null, POWER = null;

/* Health as a colour as well as a number: 80% is where Apple stops calling a
   battery healthy, so the bar changes at the same place the advice does
   rather than at some threshold of this page's own invention. */
var healthColour = function (health) {
  if (health == null) { return css("--other"); }
  if (health < 80) { return css("--bad"); }
  if (health < 88) { return css("--warn"); }
  return css("--ok");
};

var renderSide = function () {
  var b = (BATT && BATT.now) || {};
  var box = document.getElementById("healthpct");
  if (!b.present) {
    box.innerHTML = "&mdash;";
    document.getElementById("sidefacts").innerHTML =
      '<div class="kv"><span class="muted">No battery is installed.</span></div>';
    return;
  }
  box.innerHTML = b.health == null ? "&mdash;"
    : Math.round(b.health) + "<small>%</small>";
  var bar = document.getElementById("healthbar");
  bar.style.width = (b.health == null ? 0 : Math.max(2, Math.min(100, b.health)))
    + "%";
  bar.style.background = healthColour(b.health);

  var state = b.charging ? "Charging"
    : (b.plugged ? (b.fully_charged ? "Charged" : "Plugged in") : "On battery");
  document.getElementById("sidefacts").innerHTML =
    '<div class="sect"><h2>Right now</h2>' +
    kv("Charge", esc(b.percent == null ? "—" : b.percent + "%")) +
    kv("State", esc(state)) +
    kv(b.charging ? "Until full" : "Until empty",
       esc(hhmm(b.charging ? b.to_full_minutes : b.to_empty_minutes))) +
    (b.watts != null ? kv("Power", esc(b.watts + " W")) : "") +
    (b.celsius != null ? kv("Temperature", esc(b.celsius + " °C")) : "") +
    "</div>" +
    '<div class="sect"><h2>Wear</h2>' +
    kv("Cycles", esc((b.cycles == null ? "—" : b.cycles) + " of " +
                     (b.rated_cycles || "—"))) +
    kv("Cycles left", esc(b.cycles_left == null ? "—" : String(b.cycles_left))) +
    kv("Full charge", esc(b.nominal_mah ? b.nominal_mah + " mAh" : "—")) +
    kv("When new", esc(b.design_mah ? b.design_mah + " mAh" : "—")) +
    kv("Condition", '<span class="pill ' +
       (b.worn ? "bad" : (b.health != null && b.health < 88 ? "warn" : "ok")) +
       '">' + esc(b.worn ? "Service recommended" : "Normal") + "</span>") +
    "</div>";
};

/* The charge line. One stroke, with the mains-powered stretches shaded, so
   "it fell overnight" and "it was plugged in all afternoon" are the same
   picture rather than two. */
var drawChart = function () {
  var canvas = document.getElementById("chart");
  var rows = (BATT && BATT.history) || [];
  var dpr = window.devicePixelRatio || 1;
  var w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) { return; }
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  var g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  if (rows.length < 2) {
    g.fillStyle = css("--ink3");
    g.font = "11px -apple-system,system-ui,sans-serif";
    g.textAlign = "center";
    g.fillText("Not enough recorded yet.", w / 2, h / 2);
    return;
  }
  var first = rows[0].ts, last = rows[rows.length - 1].ts;
  var span = Math.max(1, last - first);
  var x = function (ts) { return ((ts - first) / span) * w; };
  var y = function (pct) { return h - 6 - (pct / 100) * (h - 14); };

  // Mains stretches behind the line.
  g.fillStyle = "rgba(34,197,94,.10)";
  var runStart = null;
  rows.forEach(function (r, i) {
    if (r.on_ac && runStart === null) { runStart = r.ts; }
    if ((!r.on_ac || i === rows.length - 1) && runStart !== null) {
      g.fillRect(x(runStart), 0, Math.max(1, x(r.ts) - x(runStart)), h);
      runStart = null;
    }
  });

  [0, 50, 100].forEach(function (pct) {
    g.strokeStyle = "rgba(140,140,150,.16)";
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, y(pct)); g.lineTo(w, y(pct)); g.stroke();
    g.fillStyle = css("--ink3");
    g.font = "9px -apple-system,system-ui,sans-serif";
    g.textAlign = "left";
    g.fillText(pct + "%", 2, y(pct) - 2);
  });

  g.strokeStyle = css("--s1");
  g.lineWidth = 1.8;
  g.lineJoin = "round";
  g.beginPath();
  rows.forEach(function (r, i) {
    var px = x(r.ts), py = y(r.percent);
    if (i === 0) { g.moveTo(px, py); } else { g.lineTo(px, py); }
  });
  g.stroke();
};

/* Nights, and what each one cost. This is the sleep card that used to sit on
   the dashboard, with the charge it lost beside it -- which is the only way
   "something kept your Mac awake" becomes a number rather than a complaint. */
var renderSleeps = function () {
  var box = document.getElementById("sleeps");
  var spans = (POWER && POWER.spans) || [];
  var kept = (POWER && POWER.kept_awake) || [];
  var drain = (POWER && POWER.drain) || {};
  var out = "";

  out += "<h2>Overnight</h2>";
  if (drain.asleep_seconds) {
    out += '<div class="night"><span class="when">Asleep</span>' +
      '<span class="what">' + esc(dur(drain.asleep_seconds)) +
      ", woken " + (drain.wakes || 0) + " time" +
      ((drain.wakes || 0) === 1 ? "" : "s") +
      (drain.dark_wakes ? " (" + drain.dark_wakes + " without the screen)" : "") +
      '</span><span class="cost ' +
      ((drain.per_hour || 0) > 2 ? "drop" : "fine") + '">' +
      esc((drain.charge_lost || 0) + "% lost") + "</span></div>";
  } else {
    out += '<div class="night fine"><span class="what">Nothing recorded ' +
      "yet.</span></div>";
  }

  if (kept.length) {
    out += "<h2>What held it awake</h2>";
    out += kept.slice(0, 10).map(function (k) {
      return '<div class="night"><span class="when">' +
        esc(dur(k.seconds)) + '</span><span class="what">' +
        esc(k.process) + '</span><span class="cost fine">' +
        esc((k.kinds || []).join(", ")) + "</span></div>";
    }).join("");
  }

  if (spans.length) {
    out += "<h2>Recent wakes</h2>";
    out += spans.slice(0, 14).map(function (s) {
      var when = s.woke_ts
        ? new Date(s.woke_ts * 1000).toLocaleString(undefined,
            {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"})
        : "—";
      return '<div class="night"><span class="when">' + esc(when) +
        '</span><span class="what">' +
        esc(s.woke_because || s.wake_reason || "woke") + "</span>" +
        '<span class="cost ' + (s.charge_lost > 3 ? "drop" : "fine") + '">' +
        esc(s.charge_lost != null ? s.charge_lost + "%" : "") + "</span></div>";
    }).join("");
  }
  box.innerHTML = out;
};

var renderInspector = function () {
  var b = (BATT && BATT.now) || {};
  var holds = (POWER && POWER.holding_now) || [];
  var pane = document.getElementById("inspbody");
  pane.innerHTML =
    '<div class="sect"><h2>Holding your Mac awake now</h2>' +
    (holds.length
      ? holds.slice(0, 12).map(function (hold) {
          return '<div class="hold"><b>' + esc(hold.name || hold.process) +
            "</b><span>" + esc(dur(hold.seconds)) + "</span></div>";
        }).join("")
      : '<div class="kv"><span class="muted">Nothing. Your Mac can sleep ' +
        "when it is idle.</span></div>") +
    "</div>" +
    '<div class="sect"><h2>This battery</h2>' +
    kv("Serial", esc(b.serial || "—")) +
    kv("Voltage", esc(b.volts != null ? b.volts + " V" : "—")) +
    kv("Current", esc(b.amps != null ? b.amps + " A" : "—")) +
    "</div>" +
    '<div class="sect"><h2>How this is measured</h2>' +
    '<div class="kv"><span class="muted">Capacity comes from the battery ' +
    "controller itself, not from an estimate. Health is its present full " +
    "charge against the charge it held when new; macOS reports " +
    "&ldquo;100%&rdquo; for a different figure, which is why this number is " +
    "lower and why it is the one System Information agrees with.</span></div>" +
    "</div>";
};

var render = function () {
  renderSide();
  drawChart();
  renderSleeps();
  renderInspector();
  document.getElementById("verdict").textContent =
    (BATT && BATT.verdict) || "Reading the battery…";
};

var load = function () {
  fetch(api("/api/battery", {hours: 24}))
    .then(function (r) { return r.json(); })
    .then(function (d) { BATT = d; render(); })
    .catch(function () {
      document.getElementById("verdict").textContent =
        "Could not read the battery — retrying.";
    });
  fetch(api("/api/power"))
    .then(function (r) { return r.json(); })
    .then(function (d) { POWER = d; render(); })
    .catch(function () {});
};

window.addEventListener("resize", drawChart);
load();
// A battery is a slow thing. Once a minute is faster than anything here moves.
setInterval(load, 60000);
</script>
</body>
</html>
